name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # --- SETUP TEMPORARY DRIVE D: ---
      - name: Setup Temporary Drive D
        shell: powershell
        run: |
          Write-Host "=== TEMPORARY DRIVE D: ==="

          $d = Get-Volume -DriveLetter D -ErrorAction SilentlyContinue

          if (-not $d) {
              Write-Error "Temporary drive D: tidak ditemukan."
              exit 1
          }

          Write-Host "D: ditemukan"
          Write-Host "Filesystem : $($d.FileSystem)"
          Write-Host "Size       : $([math]::Round($d.Size / 1GB, 2)) GB"
          Write-Host "Free space : $([math]::Round($d.SizeRemaining / 1GB, 2)) GB"

          # Cek ukuran maksimum partition D:
          $partition = Get-Partition -DriveLetter D
          $supported = Get-PartitionSupportedSize -DriveLetter D

          $currentSize = $partition.Size
          $maximumSize = $supported.SizeMax

          Write-Host ""
          Write-Host "Current partition : $([math]::Round($currentSize / 1GB, 2)) GB"
          Write-Host "Maximum partition : $([math]::Round($maximumSize / 1GB, 2)) GB"

          # Expand D: jika masih ada ruang yang bisa digunakan
          if ($maximumSize -gt $currentSize) {
              Write-Host "Expanding D:..."

              Resize-Partition `
                  -DriveLetter D `
                  -Size $maximumSize

              Write-Host "D: berhasil diperbesar."
          }
          else {
              Write-Host "D: sudah menggunakan ukuran maksimum."
          }

          # Tampilkan hasil akhir
          $dFinal = Get-Volume -DriveLetter D

          Write-Host ""
          Write-Host "================================"
          Write-Host "FINAL TEMPORARY DRIVE D:"
          Write-Host "Size       : $([math]::Round($dFinal.Size / 1GB, 2)) GB"
          Write-Host "Free space : $([math]::Round($dFinal.SizeRemaining / 1GB, 2)) GB"
          Write-Host "================================"


      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow incoming RDP connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force


      - name: Create RDP User with Secure Password
        run: |
          $username = "XILITXZ"
          $password = "P@ssw0rd2026!Secure"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name $username `
                        -Password $securePass `
                        -AccountNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          if (-not (Get-LocalUser -Name $username)) {
              Write-Error "User creation failed"
              exit 1
          }


      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force


      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV


      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"


      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "==================`n"

          # Keep runner active
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
